<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">RtG-Language character</title>
  <desc id="desc">A small pale-blue character with a white cap, rendered without a background.</desc>
  <defs>
    <linearGradient id="face" x1="29" y1="57" x2="76" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#c4dce4"/><stop offset=".58" stop-color="#91adbb"/><stop offset="1" stop-color="#71899e"/></linearGradient>
    <linearGradient id="roundBody" x1="73" y1="50" x2="114" y2="104" gradientUnits="userSpaceOnUse"><stop stop-color="#e4e8ff"/><stop offset=".6" stop-color="#b7c3e7"/><stop offset="1" stop-color="#8e9ac5"/></linearGradient>
    <linearGradient id="cap" x1="35" y1="15" x2="96" y2="67" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".65" stop-color="#f1f2fa"/><stop offset="1" stop-color="#cad5ec"/></linearGradient>
  </defs>
  <g stroke="#59071e" stroke-linecap="round" stroke-linejoin="round">
    <!-- the large rounded lobe behind the face -->
    <path fill="url(#roundBody)" stroke-width="7" d="M78 48c19-9 37 5 40 22 4 19-7 36-24 39-14 3-29-4-34-17-6-16 2-36 18-44Z"/>
    <!-- left lower arm/foot -->
    <path fill="#d7e7f0" stroke-width="7" d="M25 77c-13 7-18 24-9 34 9 10 27 9 37 0 8-8 6-22-2-29-7-6-18-8-26-5Z"/>
    <!-- tall face, slightly turned to the viewer -->
    <path fill="url(#face)" stroke-width="7" d="M31 55c-10 11-12 35-2 48 9 12 28 16 41 7 13-9 15-31 5-45-9-12-32-19-44-10Z"/>
    <!-- oversized cap, with its floppy overhang -->
    <path fill="url(#cap)" stroke-width="7" d="M21 49c2-12 7-23 17-30 12-9 32-10 46-3 12 6 18 16 20 28 2 9 0 17-6 20-8 4-16-2-19-10l-4-10c-14 6-30 3-42-5l-5 12c-3 8-10 10-14 5-3-2-3-6-2-9 3 2 6 3 9 2Z"/>
    <!-- long cap brim across the forehead -->
    <path fill="#f9fbff" stroke-width="6" d="M23 48c12 3 31 10 52 3 8-2 14-6 21-9"/>
    <!-- cap folds: deliberately hand-drawn, not text -->
    <path fill="none" stroke="#76223a" stroke-width="4" d="M38 28c8-6 19-8 29-5M34 35c11-7 24-7 35-2M45 42c10-5 20-5 29-1M50 20c6 4 11 5 17 4"/>
    <!-- big white eyes and small square-ish mouth -->
    <ellipse cx="44" cy="76" rx="6" ry="9" fill="#fff" stroke-width="5"/>
    <ellipse cx="66" cy="75" rx="6" ry="9" fill="#fff" stroke-width="5"/>
    <path fill="#fff" stroke-width="5" d="M51 94c5 2 11 2 16-1l1 10c-5 4-11 4-17 0Z"/>
    <!-- seams on the right lobe -->
    <path fill="none" stroke="#76223a" stroke-width="4" d="M91 57c5 8 6 18 3 28M100 63c4 8 4 16 1 24"/>
  </g>
</svg>
