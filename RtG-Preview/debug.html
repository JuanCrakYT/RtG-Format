<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RtG-Preview Debug</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        #log { position: fixed; top: 0; left: 0; width: 100%; height: 40%; overflow: auto; background: rgba(0,0,0,0.75); color: #e0e0e0; font-family: monospace; font-size: 12px; padding: 8px; z-index: 99999; }
        #log .error { color: #ff5252; }
    </style>
</head>
<body>
    <div id="log"></div>
    <script src="preview.js"></script>
    <script>
        var logEl = document.getElementById('log');
        function log(msg, isError) {
            var d = document.createElement('div');
            d.textContent = (isError ? '[ERR] ' : '[LOG] ') + msg;
            if (isError) d.className = 'error';
            logEl.appendChild(d);
            console.log((isError ? '[ERR] ' : '[LOG] ') + msg);
        }
        log('inline: RtGPreview=' + typeof window.RtGPreview);
        if (window.RtGPreview) {
            window.RtGPreview.ready.then(function() {
                log('inline: ready resolved');
                return window.RtGPreview.render([['Teeth', [], {}]]);
            }).then(function() {
                log('inline: render completed');
            }).catch(function(err) {
                log('inline: ERROR=' + err.message, true);
            });
        } else {
            log('inline: RtGPreview is undefined', true);
        }
    </script>
</body>
</html>
