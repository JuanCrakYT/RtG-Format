<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RtG-Preview Debug</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        #status { position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); color: white; font-family: monospace; font-size: 12px; padding: 8px; z-index: 99999; }
    </style>
</head>
<body>
    <div id="status">Initializing...</div>
    <script src="RtG-Preview/preview.debug.js"></script>
    <script>
        var status = document.getElementById('status');
        var start = Date.now();

        function logStatus(msg) {
            status.textContent = '[' + (Date.now() - start) + 'ms] ' + msg;
            console.log('[TEST] ' + msg);
        }

        logStatus('preview.debug.js loaded');
        logStatus('RtGPreview=' + typeof window.RtGPreview);
        logStatus('ready=' + typeof window.RtGPreview.ready);

        window.RtGPreview.ready.then(function() {
            logStatus('ready resolved');
            return window.RtGPreview.render([
                ["Teeth", [], {}]
            ]);
        }).then(function() {
            logStatus('render completed');
        }).catch(function(err) {
            logStatus('ERROR: ' + err.message);
            console.error(err);
        });
    </script>
</body>
</html>
