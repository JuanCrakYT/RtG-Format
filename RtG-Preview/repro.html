<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RtG-Preview Repro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        #log { position: fixed; top: 0; left: 0; width: 100%; height: 40%; overflow: auto; background: rgba(0,0,0,0.7); color: #e0e0e0; font-family: monospace; font-size: 12px; padding: 8px; z-index: 99999; }
    </style>
</head>
<body>
    <div id="log"></div>
    <script id="rtg-preview-script" src="RtG-Preview/preview.js"></script>
    <script>
        var logEl = document.getElementById('log');
        function log(msg) { var d = document.createElement('div'); d.textContent = msg; logEl.appendChild(d); console.log(msg); }

        log('document.currentScript=' + (document.currentScript && document.currentScript.src));
        log('preview script src=' + (document.getElementById('rtg-preview-script') && document.getElementById('rtg-preview-script').src));
        log('RtGPreview=' + typeof window.RtGPreview);
        log('ready=' + (window.RtGPreview && typeof window.RtGPreview.ready));

        window.RtGPreview.ready.then(function() {
            log('ready resolved');
            return window.RtGPreview.render([['Teeth', [], {}]]);
        }).then(function() {
            log('render completed');
        }).catch(function(err) {
            log('ERROR: ' + err.message);
            console.error(err);
        });
    </script>
</body>
</html>
